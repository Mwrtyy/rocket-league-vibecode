name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh dependency lock
        if: github.event_name == 'pull_request'
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh dependency lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p reports
      - id: lint
        continue-on-error: true
        run: pnpm lint > reports/lint.log 2>&1
      - id: typecheck
        continue-on-error: true
        run: pnpm typecheck > reports/typecheck.log 2>&1
      - id: test
        continue-on-error: true
        run: pnpm test > reports/test.log 2>&1
      - id: build
        continue-on-error: true
        run: pnpm build > reports/build.log 2>&1
      - id: format
        continue-on-error: true
        run: pnpm format:check > reports/format.log 2>&1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: reports
          if-no-files-found: error
      - if: always()
        env:
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TEST: ${{ steps.test.outcome }}
          BUILD: ${{ steps.build.outcome }}
          FORMAT: ${{ steps.format.outcome }}
        run: |
          printf 'lint=%s\ntypecheck=%s\ntest=%s\nbuild=%s\nformat=%s\n' "$LINT" "$TYPECHECK" "$TEST" "$BUILD" "$FORMAT"
          test "$LINT" = success
          test "$TYPECHECK" = success
          test "$TEST" = success
          test "$BUILD" = success
          test "$FORMAT" = success
